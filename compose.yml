
services:
  postgres:
    image: postgres:17
    container_name: turnero-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  portainer:
    image: portainer/portainer-ce:lts
    container_name: turnero-portainer
    restart: unless-stopped

    ports:
      - "9443:9443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: turnero-uptime-kuma
    restart: unless-stopped

    ports:
      - "3001:3001"

    volumes:
      - uptime_kuma_data:/app/data

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: turnero-proxy
    restart: unless-stopped

    environment:
      TZ: America/Argentina/Buenos_Aires

    ports:
      - "80:80"
      - "81:81"
      - "443:443"

    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt

  turnero:
    build: .
    container_name: turnero-app
    restart: unless-stopped

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: 3000

    ports:
      - "127.0.0.1:3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: turnero-dashboard
    restart: unless-stopped

    environment:
      HOMEPAGE_ALLOWED_HOSTS: "192.168.56.6:8080"
      PUID: "1000"
      PGID: "1000"

    ports:
      - "192.168.56.6:8080:3000"

    volumes:
      - ./dashboard:/app/config

volumes:
  postgres_data:
  portainer_data:
  uptime_kuma_data:
  npm_data:
  npm_letsencrypt:
